[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "upgaming-petseg"
version = "0.1.0"
description = "Reproducible pet foreground segmentation experiments and local demo"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<3", "torchvision>=0.20,<1", "numpy>=1.26,<3", "Pillow>=10.4,<13", "streamlit>=1.40,<2", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
petseg = "petseg.cli:main"

[tool.setuptools.packages.find]
include = ["petseg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
